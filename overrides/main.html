{% extends "base.html" %}
{% set home_url = (nav.homepage.url | url) if nav and nav.homepage else "/" %}

{% block site_nav %}
  <!-- 좌측 네비게이션 사이드바 -->
  <aside class="md-sidebar md-sidebar--primary" data-md-component="sidebar" data-md-type="navigation">
    <div class="md-sidebar__scrollwrap">
      <div class="md-sidebar__inner">

        <!-- ★ 카드형 배너 (클릭 시 홈) -->
        <a class="lbl-side-hero" href="{{ home_url }}" aria-label="Go to Home">
          <img src="{{ 'assets/purple_rose.png' | url }}" alt="Log by Lea" />
        </a>

        <!-- 기본 네비게이션 트리 -->
        {% include "partials/nav.html" %}

      </div>
    </div>
  </aside>

  <!-- 우측: TOC 사이드바 (그대로 유지) -->
  <aside class="md-sidebar md-sidebar--secondary" data-md-component="sidebar" data-md-type="toc">
    <div class="md-sidebar__scrollwrap">
      <div class="md-sidebar__inner">
        {% include "partials/toc.html" %}
      </div>
    </div>
  </aside>
{% endblock %}
